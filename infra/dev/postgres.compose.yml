services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cmaster
      POSTGRES_PASSWORD: cmaster_dev
      POSTGRES_DB: cmaster_next
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmaster -d cmaster_next"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cmaster-next-postgres:/var/lib/postgresql/data

volumes:
  cmaster-next-postgres:
