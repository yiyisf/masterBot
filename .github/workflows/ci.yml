name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build backend
        # P0-3/P0-4 回归守护：tests/skill-prod-loading.test.ts 通过 dist/ 是否存在判断是否运行
        # #skill-kit 生产解析路径的回归测试，不构建 dist/ 会导致该测试套件被静默跳过。
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Build frontend
        run: cd web && npm ci && npm run build

  workspace-foundation:
    name: Workspace Foundation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cmaster
          POSTGRES_PASSWORD: cmaster_dev
          POSTGRES_DB: cmaster_next
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmaster -d cmaster_next"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://cmaster:cmaster_dev@localhost:5432/cmaster_next
      NEXT_ARCHITECTURE_ENABLED: "true"
      NEXT_PUBLIC_CMASTER_API_URL: http://localhost:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Check workspace foundation
        run: npm run next:check

      - name: Test PostgreSQL integration
        run: npm run next:test:integration
