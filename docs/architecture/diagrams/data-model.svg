<path class="edge" d="M 1530.0 170.0 L 1530.0 352.5"/>
<path class="edge" d="M 1530.0 552.5 L 860.0 170.0"/>
<path class="edge" d="M 1530.0 735.0 L 1530.0 552.5"/>
<path class="edge" d="M 185.0 522.5 L 860.0 170.0"/>
<path class="edge" d="M 1205.0 162.5 L 1205.0 872.5"/>
<rect class="group" x="55" y="1000" width="1595" height="165" rx="14"/>
<text class="group-title" x="80" y="1035">Key invariants</text>
<text class="card-text" x="90" y="1070">• Messages are canonical; Runs reference them rather than copy history.</text>
<text class="card-text" x="850" y="1070">• A Run contains an Invocation tree; provider Engine Sessions remain adapter state.</text>
<text class="card-text" x="90" y="1104">• State tables are authoritative for queries; Run Events are append-only timelines.</text>
<text class="card-text" x="850" y="1104">• Artifacts reference replaceable content storage; Tool effects use a call ledger.</text>
<text class="card-text" x="90" y="1138">• Every owned record is Organization-scoped and every Run pins configuration/policy versions.</text>
</svg>